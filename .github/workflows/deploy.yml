# Deploys a *GA tag to production, https://rbacr.nu01.com, through
# scripts/deploy.sh (stacks rbacr and rbacr-artifacts), and ends by checking
# that the live site serves this tag's version.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# rbacr-github-deploy role (infra/github-deploy.yaml), which only trusts *GA
# tag runs of this repository. Its ARN is the repository variable
# AWS_DEPLOY_ROLE_ARN.
#
# The Release workflow runs on the same tags and publishes the Lambda zip.
name: Deploy

on:
  push:
    tags:
      - "*GA"

permissions:
  contents: read
  id-token: write

# One production deploy at a time; a newer tag waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rbacr-sls
    # No `environment:` here: it would change the OIDC subject, which the
    # deploy role matches (repo:…:ref:refs/tags/X.Y.Z-GA).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rbacr-sls/package-lock.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rbacr-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ github.ref_name }}
        env:
          STAGE: prod
          TAG: ${{ github.ref_name }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          # This tenant's settings: RBACR_GA_<NAME> becomes RBACR_<NAME>.
          RBACR_ROOT_LIST: ${{ vars.RBACR_GA_ROOT_LIST }}
          RBACR_GOOGLE_CLIENT_ID: ${{ vars.RBACR_GA_GOOGLE_CLIENT_ID }}
          HEALTH_EMAILS: ${{ vars.RBACR_GA_HEALTH_EMAILS }}
          # Secrets; when unset, the stack keeps its deployed values.
          RBACR_GOOGLE_CLIENT_SECRET: ${{ secrets.RBACR_GA_GOOGLE_CLIENT_SECRET }}
          RBACR_STRIPE_WEBHOOK_SECRET: ${{ secrets.RBACR_GA_STRIPE_WEBHOOK_SECRET }}
          RBACR_STRIPE_API_KEY: ${{ secrets.RBACR_GA_STRIPE_API_KEY }}
        run: bash scripts/deploy.sh
