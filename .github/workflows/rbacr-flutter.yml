# Checks the rbacr-flutter Dart client (rbacr-flutter/README.md): analysis,
# formatting and the offline unit tests, on pull requests and pushes to
# main that touch it. The end-to-end tests need a dev server and run
# locally (README "Develop").
name: rbacr-flutter

on:
  pull_request:
    paths:
      - .github/workflows/rbacr-flutter.yml
      - rbacr-flutter/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rbacr-flutter.yml
      - rbacr-flutter/**

permissions:
  contents: read

concurrency:
  group: rbacr-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rbacr-flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --line-length 120 --set-exit-if-changed lib test example
      - run: dart test
