# Deploys a release candidate to https://rc.rbacr.nu01.com: every pushed
# tag matching *RC* (e.g. 0.1.202610041200-RC, from scripts/release-rc.sh),
# or a manual run. It runs scripts/deploy.sh with STAGE=rc, which uses the
# RC's own stacks (rbacr-rc, rbacr-rc-artifacts) and database, and ends by
# checking that the RC site serves this version.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# rbacr-github-deploy-rc role (infra/github-deploy.yaml). That role trusts
# only *RC* tag runs and manual runs from main, and may only manage the
# rbacr-rc stacks and the rc.rbacr.nu01.com records. Its ARN is the
# repository variable AWS_DEPLOY_RC_ROLE_ARN.
#
# The Release workflow runs on the same tags and publishes the Lambda zip
# as a prerelease.
name: Deploy RC

on:
  push:
    tags:
      - "*RC*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (e.g. 0.1.202610041200-RC). Empty deploys the selected branch's commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# One RC deploy at a time; a newer one waits for the running one.
concurrency:
  group: deploy-rc
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject, which the
    # deploy role matches (the tag, or refs/heads/main for manual runs).
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag=""
          fi
          if [[ -n "$tag" && ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:-the current commit} to rc.rbacr.nu01.com"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_RC_ROLE_ARN }}
          role-session-name: rbacr-deploy-rc-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ steps.tag.outputs.tag || github.sha }} to RC
        env:
          STAGE: rc
          TAG: ${{ steps.tag.outputs.tag }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          # This tenant's settings: RBACR_RC_<NAME> becomes RBACR_<NAME>.
          RBACR_ROOT_LIST: ${{ vars.RBACR_RC_ROOT_LIST }}
          RBACR_GOOGLE_CLIENT_ID: ${{ vars.RBACR_RC_GOOGLE_CLIENT_ID }}
          HEALTH_EMAILS: ${{ vars.RBACR_RC_HEALTH_EMAILS }}
          # Secrets; when unset, the stack keeps its deployed values.
          RBACR_GOOGLE_CLIENT_SECRET: ${{ secrets.RBACR_RC_GOOGLE_CLIENT_SECRET }}
        run: bash scripts/deploy.sh
