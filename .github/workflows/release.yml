# Builds and tests rbacr, packages the Lambda zip (scripts/package-lambda.sh)
# and publishes it as a GitHub release.
#
# - Tag pushes matching *RC* (e.g. 0.1.202610041200-RC) release that tag as
#   a prerelease; *GA tags (e.g. 0.1.202610041200-GA) as the latest full
#   release. scripts/release-rc.sh and scripts/release-ga.sh push them. The
#   Deploy RC and Deploy workflows run on the same tags.
# - Manual dispatch releases the chosen tag, creating it on the dispatched
#   commit if it doesn't exist yet.
# - Pull requests that change the app or its build only build and test (no
#   release), so a broken build shows up before a tag does.
name: Release

on:
  push:
    tags:
      - "*RC*"
      - "*GA"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on this commit if missing). Empty uses the selected tag, or manual-<run number>.
        required: false
        type: string
      prerelease:
        description: Mark as a prerelease
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rbacr-sls/src/**
      - rbacr-sls/static/**
      - rbacr-sls/tests/**
      - rbacr-sls/lambda.js
      - rbacr-sls/package.json
      - rbacr-sls/package-lock.json
      - rbacr-sls/vite.config.ts
      - rbacr-sls/tsconfig.json
      - rbacr-sls/scripts/package-lambda.sh
      - rbacr-sls/scripts/version.sh
      - rbacr-sls/version.X.txt
      - rbacr-sls/version.Y.txt

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rbacr-sls
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tag
        name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="manual-$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag': use letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # A tag that carries X.Y.Z (e.g. 0.1.202610041200-RC) keeps its Z, and
      # its X.Y must match the version files; any other build gets Z from
      # the current time.
      - id: version
        name: Resolve the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            export VERSION_Z="${BASH_REMATCH[3]}"
            tag_xy="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi
          source scripts/version.sh
          if [[ -n "${tag_xy:-}" && "$tag_xy" != "$VERSION_X.$VERSION_Y" ]]; then
            echo "::error::Tag $TAG is version $tag_xy, but version.X.txt/version.Y.txt say $VERSION_X.$VERSION_Y"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rbacr-sls
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rbacr-sls/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Unit and domain tests
        run: npx vitest --run
      - run: npm run build

      # Production dependencies only, smoke-tested through lambda.js.
      - name: Package the Lambda
        run: OUT="dist/rbacr-$TAG-lambda.zip" bash scripts/package-lambda.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbacr-lambda
          path: rbacr-sls/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbacr-lambda
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ (github.event_name == 'push' && !endsWith(github.ref_name, 'GA')) || (github.event_name != 'push' && inputs.prerelease) }}
        run: |
          ls -l dist
          title="rbacr-$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title"
          else
            flags=(--title "$title" --generate-notes --target "$GITHUB_SHA")
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
