services:
  # The app's table (RBACR_DYNAMODB_TABLE) on DynamoDB Local, persisted in a
  # volume. The app creates the table on first use.
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    container_name: devbox-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports:
      - "${RBACR_DYNAMODB_PORT:-8642}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
