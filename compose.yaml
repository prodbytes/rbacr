services:
  postgres:
    # Same major version as Aurora (infra/app.yaml DbEngineVersion).
    image: postgres:18-alpine
    container_name: devbox-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres18-data:
