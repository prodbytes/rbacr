AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rbacr-tables (and rbacr-rc-tables): the DynamoDB tables of a stage. The
  main table holds all rbacr data (systems, roles, grants, vouchers, API
  tokens) and never deletes anything (SPEC L1); <name>-sessions holds the
  sign-in sessions, purged by TTL a retention period after they expire
  (SPEC S3). On-demand billing, point-in-time recovery, deletion
  protection, and kept (Retain) if the stack goes away. Their shapes match
  tableDefinition() in src/lib/server/dynamo.ts. Deployed by
  scripts/deploy.sh before the app stack (infra/app.yaml), which reads the
  table names and ARNs from its outputs.

Parameters:
  TableName:
    Type: String
    AllowedPattern: '[a-zA-Z0-9_.-]{3,255}'
    Description: rbacr for prod, rbacr-rc for the release candidate

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${TableName}-sessions
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Each session carries here (Unix seconds) its expiry plus the
      # retention (RBACR_SESSION_RETENTION_DAYS); DynamoDB purges it after.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  TableName:
    Value: !Ref Table
  TableArn:
    Value: !GetAtt Table.Arn
  SessionsTableName:
    Value: !Ref SessionsTable
  SessionsTableArn:
    Value: !GetAtt SessionsTable.Arn
