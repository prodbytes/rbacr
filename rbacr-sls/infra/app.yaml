AWSTemplateFormatVersion: '2010-09-09'
# Fn::ForEach (one e-mail subscription per HealthNotificationEmails address).
Transform: AWS::LanguageExtensions
Description: >
  rbacr (and rbacr-rc): the role manager at https://rbacr.nu01.com (or
  https://rc.rbacr.nu01.com). One Lambda (the SvelteKit app, lambda.js)
  using the stage's DynamoDB table (infra/tables.yaml), behind a function
  URL, fronted by CloudFront with an ACM certificate validated in the
  nu01.com zone. The DNS aliases (rbacr.nu01.com, rc.rbacr.nu01.com) belong
  to the nu01-dns stack in the nu01 repository, not here. CloudFront adds a secret header (from SSM
  Parameter Store) that the app requires, so the function URL is useless
  when called directly. Alarms on function errors and throttles e-mail
  HealthNotificationEmails; /health is polled by the central nu01-monitor
  stack (the nu01 repository), not here. Deploy in us-east-1 (CloudFront
  certificates live there) with scripts/deploy.sh.

Parameters:
  MaxConcurrency:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >
      The most requests the function serves at once (H6); more get 429.
      A few hundred milliseconds each, so 20 is far above rbacr's traffic.
  DomainName:
    Type: String
    Default: rbacr.nu01.com
  ValidationZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z04838091YTBIM6PNI1XK
    Description: >
      The nu01.com zone (the nu01 repository's nu01-route53-zone stack), where
      CloudFormation writes the certificate's ACM validation record.
      scripts/deploy.sh passes it.
  CodeBucket:
    Type: String
    Description: The rbacr(-rc)-artifacts stack's bucket
  CodeKey:
    Type: String
    Description: The Lambda zip's key in CodeBucket (scripts/package-lambda.sh)
  Version:
    Type: String
    Description: The release version, reported by /health
  OriginSecretParameter:
    Type: String
    AllowedPattern: '/rbacr/[a-z0-9-]+/origin-secret'
    Description: >
      Name of the SSM String parameter holding the header value CloudFront
      sends and the app requires (RBACR_ORIGIN_SECRET):
      /rbacr/<stage>/origin-secret. scripts/deploy.sh passes it, and creates
      the parameter on a stage's first deploy.
  RootList:
    Type: String
    Default: '@nu01.com'
    AllowedPattern: '[A-Za-z0-9._%+@, -]*'
    Description: >
      RBACR_ROOT_LIST, comma-separated addresses and/or domains (@example.com
      or example.com) whose identities are roots. The only source of the root
      role.
  GoogleClientId:
    Type: String
    Description: RBACR_GOOGLE_CLIENT_ID, the Google OAuth web client
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: RBACR_GOOGLE_CLIENT_SECRET
  GoogleAudiences:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9._, -]*'
    Description: >
      RBACR_GOOGLE_AUDIENCES, comma-separated Google OAuth client ids whose
      users' ID tokens /api accepts on its self-service routes (SPEC I1-I5).
      Empty turns ID tokens off.
  TrustedIssuers:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9._~%:/?=&+,"@{}\[\] -]*'
    Description: >
      RBACR_TRUSTED_ISSUERS, OIDC issuers besides Google whose ID tokens /api
      accepts on its self-service routes (SPEC I7-I9): a one-line JSON array
      of {"issuer", "jwks", "audiences"}. Empty: none.
  CorsOrigins:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9.:/, -]*'
    Description: >
      RBACR_CORS_ORIGINS, comma-separated web origins (https://app.example.com)
      allowed to call /api from the browser (SPEC H3, H4). Empty: no CORS.
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      RBACR_STRIPE_WEBHOOK_SECRET, the signing secret of the Stripe webhook
      endpoint https://<domain>/webhooks/stripe. Empty turns the paid
      subscription sync off.
  StripeApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: RBACR_STRIPE_API_KEY, a restricted key reading Customers and Subscriptions
  HealthNotificationEmails:
    Type: CommaDelimitedList
    Default: julio+health@nu01.com
    Description: >
      Addresses e-mailed when the function alarms (errors, throttles) fire
      and recover. Each one must confirm the SNS subscription e-mail before
      it gets notifications.
  TableName:
    Type: String
    Description: The stage's DynamoDB table (the rbacr(-rc)-tables stack, infra/tables.yaml)
  TableArn:
    Type: String
    Description: Its ARN
  SessionsTableName:
    Type: String
    Description: The stage's sessions table (the same stack)
  SessionsTableArn:
    Type: String
    Description: Its ARN
  SessionRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    MaxValue: 99999
    Description: Days a session record is kept after the session expires, then purged by TTL (SPEC S3)

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      # Validated in the nu01.com zone since round 2 of the zone merge (it was
      # the retired rbacr.nu01.com subzone). Changing HostedZoneId replaces
      # the certificate: CloudFormation requests a new one, validates it
      # through nu01.com with the same deterministic _<token> CNAME that
      # round 1 (nu01 repository, scripts/migrate-subzone.sh) already
      # UPSERTed there, swaps it into the distribution, then deletes the old
      # certificate.
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref ValidationZoneId

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-lambda
      # Created by infra/github-deploy.yaml; the deploy roles may only create
      # roles bounded by it (logs and the rbacr tables).
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/rbacr-lambda-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${LogGroup.Arn}
        # The stage's tables and the main one's index; nothing else.
        - PolicyName: dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Ref TableArn
                  - !Sub ${TableArn}/index/*
                  - !Ref SessionsTableArn

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      Description: !Sub rbacr ${Version} (https://${DomainName})
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: lambda.handler
      MemorySize: 1024
      Timeout: 15
      # A ceiling on what a flood can cost (H6): requests past it get 429
      # from the function URL, and ThrottlesAlarm says so.
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          # adapter-node takes the request's host from this header, which
          # CloudFront sets (the Lambda itself sees the function URL host).
          HOST_HEADER: x-rbacr-host
          RBACR_VERSION: !Ref Version
          RBACR_PUBLIC_ORIGIN: !Sub https://${DomainName}
          # The header value only CloudFront knows (the app's
          # hooks.server.ts), resolved at deploy time from a plain SSM String
          # parameter (standard tier: free; Secrets Manager charged per
          # secret). Not SecureString: CloudFormation resolves ssm-secure only
          # in a few resource types, neither Lambda environments nor
          # CloudFront origin headers. The exposure is the same anyway: the
          # value is readable in this function's configuration and the
          # distribution's, as it was with Secrets Manager.
          RBACR_ORIGIN_SECRET: !Sub '{{resolve:ssm:${OriginSecretParameter}}}'
          RBACR_ROOT_LIST: !Ref RootList
          RBACR_GOOGLE_CLIENT_ID: !Ref GoogleClientId
          RBACR_GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          RBACR_GOOGLE_AUDIENCES: !Ref GoogleAudiences
          RBACR_TRUSTED_ISSUERS: !Ref TrustedIssuers
          RBACR_CORS_ORIGINS: !Ref CorsOrigins
          RBACR_STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          RBACR_STRIPE_API_KEY: !Ref StripeApiKey
          RBACR_DYNAMODB_TABLE: !Ref TableName
          RBACR_DYNAMODB_SESSIONS_TABLE: !Ref SessionsTableName
          RBACR_SESSION_RETENTION_DAYS: !Ref SessionRetentionDays

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      # Public, but the app refuses requests without CloudFront's secret
      # header. (CloudFront's IAM origin access control for Lambda would
      # require browsers to sign POST bodies, which forms can't.)
      AuthType: NONE
      InvokeMode: BUFFERED

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # Function URLs also need lambda:InvokeFunction, limited to URL calls.
  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # Puts the viewer's IP in x-rbacr-viewer-ip, over anything the client
  # sent, for the redeem limit per network (V10). Only CloudFront reaches
  # the function (the origin secret), so the app can trust it.
  ViewerIpFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-viewer-ip
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub rbacr (${DomainName}) viewer IP header
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.headers['x-rbacr-viewer-ip'] = { value: event.viewer.ip };
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub rbacr (${DomainName})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: app
            # https://<id>.lambda-url.<region>.on.aws/ -> <id>.lambda-url.<region>.on.aws
            DomainName: !Select [2, !Split ['/', !GetAtt FunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-rbacr-origin-secret
                HeaderValue: !Sub '{{resolve:ssm:${OriginSecretParameter}}}' # as RBACR_ORIGIN_SECRET
              - HeaderName: x-rbacr-host
                HeaderValue: !Ref DomainName
        # Pages and the JSON API: nothing cached; every viewer header but
        # Host (Origin and the CORS preflight headers included), every cookie
        # and query string forwarded, and every method (OPTIONS preflights,
        # SPEC H4) reaches the app.
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerIpFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Content-hashed client assets: cached at the edge.
          - PathPattern: /_app/immutable/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  # Rate limits per client IP in front of everything (blocked requests get
  # 429), plus AWS's known-bad-inputs rules. The common rule set only
  # counts for now: watch its metrics before letting it block.
  # No DNS records here: the nu01-dns stack (nu01 repository) owns the
  # A/AAAA aliases for rbacr.nu01.com and rc.rbacr.nu01.com in nu01.com.

  # The alarms' e-mail topic. (Its name predates the move of the /health
  # check to the central nu01-monitor stack; renaming it would replace it
  # and every subscription would need confirming again.)
  HealthTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-health
      DisplayName: !Sub rbacr health (${DomainName})

  Fn::ForEach::HealthEmails:
    - Email
    - !Ref HealthNotificationEmails
    - HealthEmail&{Email}:
        Type: AWS::SNS::Subscription
        Properties:
          TopicArn: !Ref HealthTopic
          Protocol: email
          Endpoint: !Ref Email

  # The function failing or throttled: /health (polled by nu01-monitor)
  # doesn't touch the database (SPEC HC2), so these catch what it can't.
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-errors
      AlarmDescription: !Sub rbacr (${DomainName}) is throwing errors (5 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref HealthTopic]
      OKActions: [!Ref HealthTopic]

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-throttles
      AlarmDescription: !Sub rbacr (${DomainName}) requests are being throttled (Lambda concurrency)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref HealthTopic]
      OKActions: [!Ref HealthTopic]

Outputs:
  SiteUrl:
    Value: !Sub https://${DomainName}/
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  FunctionName:
    Value: !Ref Function
  FunctionUrl:
    Description: Direct calls are refused (403); use SiteUrl
    Value: !GetAtt FunctionUrl.FunctionUrl
  HealthTopicArn:
    Value: !Ref HealthTopic
