AWSTemplateFormatVersion: '2010-09-09'
Description: >
  rbacr-github-deploy: lets GitHub Actions deploy rbacr without stored keys.
  A production role that only *GA tag runs can assume, and a
  release-candidate role for *RC* tag runs and manual runs from main,
  limited to the rbacr-rc stacks and the rc.rbacr.nu01.com ACM validation
  records. Both may only create Lambda roles bounded by rbacr-lambda-boundary
  (write logs and use the rbacr tables, nothing else). Deployed once, by hand
  (infra/README.md).

Parameters:
  GitHubRepository:
    Type: String
    Default: prodbytes/rbacr
    Description: owner/name of the repository whose runs may deploy
  GitHubImmutableRepository:
    Type: String
    Default: prodbytes@288014477/rbacr@1404734829
    Description: >
      The same repository in GitHub's immutable subject form,
      owner@<owner id>/name@<repository id>. The repository uses immutable
      OIDC subject claims (gh api repos/<owner>/<name>/actions/oidc/customization/sub
      shows use_immutable_subject and the sub_claim_prefix).
  ValidationZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z04838091YTBIM6PNI1XK
    Description: >
      The nu01.com zone (the nu01 repository's nu01-route53-zone stack), where
      the certificates' ACM validation records now live (infra/app.yaml).
  DistributionId:
    Type: String
    Default: E1K2TMPPFWYEL6
    AllowedPattern: '[A-Z0-9]*'
    Description: >
      Production's CloudFront distribution (the rbacr stack's DistributionId
      output), the only one the production role may read or change. Empty
      before the first deploy; update it if the distribution is ever replaced.
  RcDistributionId:
    Type: String
    Default: E2LN31BO4LM93P
    AllowedPattern: '[A-Z0-9]*'
    Description: The RC's (the rbacr-rc stack's DistributionId output), likewise for the RC role
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: true only when the account doesn't have the GitHub OIDC provider yet (prodbytes/presence created it)

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The most a Lambda role made by the deploy roles can ever do.
  LambdaBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: rbacr-lambda-boundary
      Description: Permissions boundary for the rbacr Lambda roles (infra/app.yaml)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/rbacr*
          # The stages' DynamoDB tables (infra/tables.yaml), their indexes and sessions tables.
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr/index/*
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr-rc
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr-rc/index/*
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr-sessions
              - !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/rbacr-rc-sessions

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rbacr-github-deploy
      Description: Assumed by GitHub Actions on *GA tags to deploy rbacr (rbacr.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # In both subject forms (immutable IDs, and owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*GA
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*GA
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation: this stage's app and artifacts stacks only
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr-artifacts/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr-tables/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: '*'
              # The artifacts bucket (CloudFormation names it rbacr-artifacts-artifactsbucket-*)
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::rbacr-artifacts-*
                  - arn:aws:s3:::rbacr-artifacts-*/*
              # The function, its URL and permissions
              - Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rbacr
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rbacr:*
              # Its log group
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rbacr
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rbacr:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Its execution role: only ever with the boundary attached, so
              # a deploy can't create a role beyond "write logs, use the rbacr tables".
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-lambda
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaBoundary
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-lambda
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-lambda
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # The origin secret CloudFront sends to the function: an SSM
              # String parameter (infra/app.yaml) that scripts/deploy.sh checks,
              # or creates on the stage's first deploy, and CloudFormation
              # resolves with this role's credentials.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rbacr/prod/origin-secret
              # Only so CloudFormation can delete the stack's old Secrets
              # Manager secret (and read it, should that update roll back).
              # These can go after the next GA deploy.
              - Effect: Allow
                Action:
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rbacr-origin-secret-*
              # CloudFront: a deploy may create a distribution (the stage's first
              # deploy) and read or change only this stage's own afterwards. Never
              # another's: its configuration holds that stage's origin secret, so
              # nothing here lists or reads distributions in general.
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
              # Its WAF web ACL (infra/app.yaml), which CloudFront needs in us-east-1.
              - Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/rbacr-waf/*
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:*:global/managedruleset/*/*
              - Effect: Allow
                Action:
                  - wafv2:CheckCapacity
                  - wafv2:ListWebACLs
                  - wafv2:DescribeManagedRuleGroup
                Resource: '*'
              # The certificate and DNS records
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              # Route 53: the nu01.com zone (ValidationZoneId).
              - Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource:
                  - !Sub arn:${AWS::Partition}:route53:::hostedzone/${ValidationZoneId}
              # In nu01.com only production's ACM validation records
              # (_<token>.rbacr.nu01.com, lowercase, no trailing dot): its
              # aliases belong to the nu01-dns stack (nu01 repository), and
              # the rest of the zone to other projects.
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${ValidationZoneId}
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - _*.rbacr.nu01.com
              # The function alarms and their e-mail topic (infra/app.yaml).
              # The template uses the AWS::LanguageExtensions transform.
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              - Effect: Allow
                Action: sns:*
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:rbacr-health
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:rbacr-health:*
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-health
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-errors
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-throttles
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
              # Only so CloudFormation can delete the stack's old Route 53
              # health check (/health is now polled by the nu01-monitor stack in
              # the nu01 repository) and, with the rbacr-health alarm above,
              # its alarm. Health checks have no names to scope by. These can go
              # after the next GA deploy.
              - Effect: Allow
                Action:
                  - route53:GetHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:route53:::healthcheck/*
              # This stage's DynamoDB table (infra/tables.yaml)
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr/*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-sessions
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-sessions/*
              # The tables' data and existence are off limits to deploys, which
              # only manage their configuration through CloudFormation: a
              # compromised run can't read, change, export or delete them.
              - Effect: Deny
                Action:
                  - dynamodb:DeleteTable
                  - dynamodb:DeleteBackup
                  - dynamodb:ExportTableToPointInTime
                  - dynamodb:RestoreTableFromBackup
                  - dynamodb:RestoreTableToPointInTime
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PartiQLSelect
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'

  RcDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rbacr-github-deploy-rc
      Description: Assumed by GitHub Actions on *RC* tags and manual runs from main to deploy the rbacr release candidate (rc.rbacr.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # In both subject forms (immutable IDs, and owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation: this stage's app and artifacts stacks only
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr-rc/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr-rc-artifacts/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rbacr-rc-tables/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: '*'
              # The artifacts bucket (CloudFormation names it rbacr-rc-artifacts-artifactsbucket-*)
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::rbacr-rc-artifacts-*
                  - arn:aws:s3:::rbacr-rc-artifacts-*/*
              # The function, its URL and permissions
              - Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rbacr-rc
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:rbacr-rc:*
              # Its log group
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rbacr-rc
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rbacr-rc:*
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Its execution role: only ever with the boundary attached, so
              # a deploy can't create a role beyond "write logs, use the rbacr tables".
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-rc-lambda
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaBoundary
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-rc-lambda
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rbacr-rc-lambda
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # The origin secret CloudFront sends to the function: an SSM
              # String parameter (infra/app.yaml) that scripts/deploy.sh checks,
              # or creates on the stage's first deploy, and CloudFormation
              # resolves with this role's credentials.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rbacr/rc/origin-secret
              # Only so CloudFormation can delete the stack's old Secrets
              # Manager secret (and read it, should that update roll back).
              # These can go after the next RC deploy.
              - Effect: Allow
                Action:
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rbacr-rc-origin-secret-*
              # CloudFront: a deploy may create a distribution (the stage's first
              # deploy) and read or change only this stage's own afterwards. Never
              # another's: its configuration holds that stage's origin secret, so
              # nothing here lists or reads distributions in general.
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RcDistributionId}
              # Its WAF web ACL (infra/app.yaml), which CloudFront needs in us-east-1.
              - Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/rbacr-rc-waf/*
                  - !Sub arn:${AWS::Partition}:wafv2:us-east-1:*:global/managedruleset/*/*
              - Effect: Allow
                Action:
                  - wafv2:CheckCapacity
                  - wafv2:ListWebACLs
                  - wafv2:DescribeManagedRuleGroup
                Resource: '*'
              # The certificate and DNS records
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              # Route 53: the nu01.com zone (ValidationZoneId).
              - Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource:
                  - !Sub arn:${AWS::Partition}:route53:::hostedzone/${ValidationZoneId}
              # In nu01.com only the RC's ACM validation records
              # (_<token>.rc.rbacr.nu01.com): never prod's, nor the aliases
              # (the nu01-dns stack's) or other projects' records.
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${ValidationZoneId}
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - _*.rc.rbacr.nu01.com
              # The function alarms and their e-mail topic (infra/app.yaml).
              # The template uses the AWS::LanguageExtensions transform.
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              - Effect: Allow
                Action: sns:*
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:rbacr-rc-health
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:rbacr-rc-health:*
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-rc-health
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-rc-errors
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:rbacr-rc-throttles
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
              # Only so CloudFormation can delete the stack's old Route 53
              # health check (/health is now polled by the nu01-monitor stack in
              # the nu01 repository) and, with the rbacr-rc-health alarm above,
              # its alarm. Health checks have no names to scope by. These can go
              # after the next RC deploy.
              - Effect: Allow
                Action:
                  - route53:GetHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:route53:::healthcheck/*
              # This stage's DynamoDB table (infra/tables.yaml)
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-rc
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-rc/*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-rc-sessions
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rbacr-rc-sessions/*
              # The tables' data and existence are off limits to deploys, which
              # only manage their configuration through CloudFormation: a
              # compromised run can't read, change, export or delete them.
              - Effect: Deny
                Action:
                  - dynamodb:DeleteTable
                  - dynamodb:DeleteBackup
                  - dynamodb:ExportTableToPointInTime
                  - dynamodb:RestoreTableFromBackup
                  - dynamodb:RestoreTableToPointInTime
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PartiQLSelect
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
